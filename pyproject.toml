[project]
name = "qins"
version = "0.1.0"
description = "Multi-agent pipeline benchmarking quantum simulation of inelastic neutron scattering (DSF) against MPS and experiment."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "omegaconf>=2.3",
    "pypdf>=4.0",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "quimb>=1.10",
    "qiskit-addon-aqc-tensor[quimb-jax]>=0.2",
    "qiskit-quimb>=0.0.3",
    "tabulate>=0.9",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[project.scripts]
qins = "qins.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::scipy.sparse.SparseEfficiencyWarning"]
